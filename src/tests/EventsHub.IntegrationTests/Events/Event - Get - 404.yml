info:
  name: Event - Get - 404
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events/:eventId"
  params:
    - name: eventId
      value: The event was not found
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 404 Not Found", function() {
          expect(res.getStatus()).to.equal(404);
        });

        test("Response returns an array", function() {
          const body = res.getBody();
          expect(body).to.equal("Event not found.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
